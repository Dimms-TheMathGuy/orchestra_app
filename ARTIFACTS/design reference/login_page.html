<!-- Background Decorative Elements (The Ethereal Architect) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>

<div class="w-full max-w-[480px]">

<div class="glass-panel ethereal-shadow rounded-3xl p-10 md:p-12 border border-surface-container-lowest">

<div class="flex flex-col items-center mb-10">

<div class="text-center space-y-2">
<h1 class="text-3xl font-headline font-extrabold text-on-surface tracking-tight">
                            Welcome to ORCHESTRA
                        </h1>
<p class="text-on-surface-variant font-medium">
                            Sign in to sync your workflow across teams.
                        </p>
</div>
</div>
<!-- Form Section -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-4">
<!-- Email Field -->
<div class="group">
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1" for="email">Email address</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-highest border-transparent rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 focus:border-primary focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="email" placeholder="name@company.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2 px-1">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-sm font-semibold text-primary hover:text-primary-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-highest border-transparent rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 focus:border-primary focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="password" placeholder="••••••••" type="password">
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 gradient-btn text-on-primary font-headline font-bold rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold text-outline">
<span class="px-4 bg-white/10 backdrop-blur-sm rounded-full">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full h-12 flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline-variant/20 rounded-xl hover:bg-surface-container-low hover:border-outline-variant/40 transition-all duration-200 group">
<div class="w-5 h-5 flex items-center justify-center">
